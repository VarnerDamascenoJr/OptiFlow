name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Run sample scenario
        run: npm run scenario:small

      - name: Run strategy benchmark
        run: npm run benchmark:compare

      - name: Run statistical simulation
        run: npm run scenario:small:simulate

      - name: Run risk comparison
        run: npm run scenario:small:risk

      - name: Check whitespace
        run: git diff --check
