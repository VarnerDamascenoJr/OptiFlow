name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-solver.txt

      - name: Install OR-Tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-solver.txt

      - name: Test
        run: npm test

      - name: Run sample scenario
        run: npm run scenario:small

      - name: Run strategy benchmark
        run: npm run benchmark:compare

      - name: Run OR-Tools benchmark
        run: npm run benchmark:compare:or-tools

      - name: Run statistical simulation
        run: npm run scenario:small:simulate

      - name: Run risk comparison
        run: npm run scenario:small:risk

      - name: Run demand forecast
        run: npm run demand:forecast

      - name: Check whitespace
        run: git diff --check
